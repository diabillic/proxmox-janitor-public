name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-proxmox-janitor
  cancel-in-progress: false

jobs:
  # Tests run on GitHub-hosted runners, so pull requests (including from forks) never touch
  # your self-hosted runner.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q

  # The Dockerfile is generated by dockerfile-agent; it must build.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: |
          if [ -f Dockerfile ]; then docker build --pull --build-arg PATCHED_AT="$(date -u +%s)" --build-arg REVISION="$GITHUB_SHA" -t agent:ci .
          else echo "No Dockerfile yet"; fi

  # Deploys only from main, never for pull requests, and only once AGENT_HOST is configured
  # (see README: Secrets and variables), so a fresh clone doesn't queue jobs for a missing runner.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AGENT_HOST != ''
    # The runner of the agent's environment: PRIORITY=low deploys from the low-priority runners
    # to the low-priority Docker host, anything else from the high-priority runner.
    runs-on: ${{ vars.PRIORITY == 'low' && fromJSON('["self-hosted", "low-priority"]') || fromJSON('["self-hosted", "proxmox"]') }}
    env:
      AGENT_HOST: ${{ vars.AGENT_HOST }}
      AGENT_NAME: proxmox-janitor
      PRIORITY: ${{ vars.PRIORITY }}
      BUS_HOST_PORT: ${{ vars.BUS_HOST_PORT }}
    steps:
      - uses: actions/checkout@v5

      - name: Render agent.env
        env:
          PVE_NODES: ${{ vars.PVE_NODES }}
          DOCKER_HOSTS: ${{ vars.DOCKER_HOSTS }}
          SELF_GUEST: ${{ vars.SELF_GUEST }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          CHECK_TIME: ${{ vars.CHECK_TIME }}
          WINDOW_DAY: ${{ vars.WINDOW_DAY }}
          WINDOW_TIME: ${{ vars.WINDOW_TIME }}
          WINDOW_HOURS: ${{ vars.WINDOW_HOURS }}
          REBOOT_GUESTS: ${{ vars.REBOOT_GUESTS }}
          REBOOT_NODES: ${{ vars.REBOOT_NODES }}
          REDEPLOY: ${{ vars.REDEPLOY }}
          KEEP_SNAPSHOTS: ${{ vars.KEEP_SNAPSHOTS }}
          SNAPSHOT_KEEP: ${{ vars.SNAPSHOT_KEEP }}
          EXCLUDE_GUESTS: ${{ vars.EXCLUDE_GUESTS }}
          CPU_PERCENT: ${{ vars.CPU_PERCENT }}
          MEM_PERCENT: ${{ vars.MEM_PERCENT }}
          SUSTAIN_MINUTES: ${{ vars.SUSTAIN_MINUTES }}
          RESIZE: ${{ vars.RESIZE }}
          RESIZE_TARGET_PERCENT: ${{ vars.RESIZE_TARGET_PERCENT }}
          RESIZE_MAX_CORES: ${{ vars.RESIZE_MAX_CORES }}
          RESIZE_MAX_MEM_GB: ${{ vars.RESIZE_MAX_MEM_GB }}
          NODE_MEM_MAX_PERCENT: ${{ vars.NODE_MEM_MAX_PERCENT }}
          MONITOR_SECONDS: ${{ vars.MONITOR_SECONDS }}
          DISK_PERCENT: ${{ vars.DISK_PERCENT }}
          DISK_TARGET_PERCENT: ${{ vars.DISK_TARGET_PERCENT }}
          GROW_MIN_GB: ${{ vars.GROW_MIN_GB }}
          GROW_MAX_GB: ${{ vars.GROW_MAX_GB }}
          STORAGE_MAX_PERCENT: ${{ vars.STORAGE_MAX_PERCENT }}
          DISK_MINUTES: ${{ vars.DISK_MINUTES }}
          RENOTIFY_HOURS: ${{ vars.RENOTIFY_HOURS }}
          AGENT_BUS_PORT: ${{ vars.AGENT_BUS_PORT }}
          BOT_ALERT_URL: ${{ vars.BOT_ALERT_URL }}
          APPROVAL_MODE: ${{ vars.APPROVAL_MODE }}
          KUMA_URL: ${{ vars.KUMA_URL }}
          KUMA_USERNAME: ${{ vars.KUMA_USERNAME }}
          KUMA_NOTIFICATION: ${{ vars.KUMA_NOTIFICATION }}
          KUMA_DOCKER_HOSTS: ${{ vars.KUMA_DOCKER_HOSTS }}
          KUMA_SYNC_MINUTES: ${{ vars.KUMA_SYNC_MINUTES }}
          KUMA_INTERVAL: ${{ vars.KUMA_INTERVAL }}
          KUMA_RETRIES: ${{ vars.KUMA_RETRIES }}
          KUMA_PASSWORD: ${{ secrets.KUMA_PASSWORD }}
          AGENT_BUS_TOKEN: ${{ secrets.AGENT_BUS_TOKEN }}
          APPROVAL_NOTIFY_URLS: ${{ secrets.APPROVAL_NOTIFY_URLS }}
          NOTIFY_URLS: ${{ secrets.NOTIFY_URLS }}
        run: |
          [ -n "$AGENT_HOST" ] || { echo "::error::repo variable AGENT_HOST is not set"; exit 1; }
          [ -n "$PVE_NODES" ] || { echo "::error::repo variable PVE_NODES is not set (run deploy/provision.sh)"; exit 1; }
          [ -f Dockerfile ] || { echo "::error::no Dockerfile yet (dockerfile-agent generates it)"; exit 1; }
          case "${PRIORITY:-high}" in high|low) ;; *) echo "::error::PRIORITY must be high or low"; exit 1;; esac
          mkdir -p stage/context
          cp -r proxmox_janitor requirements.txt Dockerfile .dockerignore stage/context/
          (umask 077; : > stage/agent.env)
          for v in PVE_NODES DOCKER_HOSTS SELF_GUEST TIMEZONE CHECK_TIME WINDOW_DAY WINDOW_TIME \
                   WINDOW_HOURS REBOOT_GUESTS REBOOT_NODES REDEPLOY KEEP_SNAPSHOTS SNAPSHOT_KEEP \
                   EXCLUDE_GUESTS CPU_PERCENT MEM_PERCENT SUSTAIN_MINUTES MONITOR_SECONDS DISK_PERCENT \
                   RESIZE RESIZE_TARGET_PERCENT RESIZE_MAX_CORES RESIZE_MAX_MEM_GB NODE_MEM_MAX_PERCENT \
                   DISK_TARGET_PERCENT GROW_MIN_GB GROW_MAX_GB STORAGE_MAX_PERCENT DISK_MINUTES \
                   RENOTIFY_HOURS AGENT_BUS_PORT BOT_ALERT_URL APPROVAL_MODE AGENT_BUS_TOKEN \
                   APPROVAL_NOTIFY_URLS NOTIFY_URLS \
                   KUMA_URL KUMA_USERNAME KUMA_NOTIFICATION KUMA_DOCKER_HOSTS KUMA_SYNC_MINUTES \
                   KUMA_INTERVAL KUMA_RETRIES KUMA_PASSWORD; do
            if [ -n "${!v}" ]; then printf '%s=%s\n' "$v" "${!v}" >> stage/agent.env; fi
          done
          publish=""
          [ -z "$BUS_HOST_PORT" ] || publish="$BUS_HOST_PORT:${AGENT_BUS_PORT:-8765}"
          printf 'REVISION=%s\nPUBLISH=%s\nPRIORITY=%s-priority\n' "$GITHUB_SHA" "$publish" "${PRIORITY:-high}" > stage/deploy.env

      - name: Ship, build and run
        run: |
          rsync -a --delete --exclude '__pycache__' stage/ "deploy@$AGENT_HOST:staging/$AGENT_NAME/"
          ssh "deploy@$AGENT_HOST" sudo /usr/local/sbin/agent-deploy "$AGENT_NAME"

      - name: Clean up rendered secrets
        if: always()
        run: rm -rf stage
